        .logo {

        }

        .links a:hover {
            opacity: 1;
        }

        button,
        select,

        }

        .pill {

            background: linear-gradient(135deg, #ffffff30, #ffffff0c);

            border-radius: 30px;
            padding: 10px 14px;
            cursor: pointer;
            backdrop-filter: blur(12px);
        }

        select {

            background: #292930;
            border: 1px solid #ffffff55;
            border-radius: 30px;
            padding: 10px;
            cursor: pointer;
        }

        select option {
            color: white;
            background: #222;
        }

        header {

            isolation: isolate;
            overflow: hidden;
            min-height: 100vh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 110px 20px 60px;
            background: #101014;
        }

        header::before,
        header::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        header::before {
            z-index: -2;
            background: url('ohio-car.jpg') center 55% / cover no-repeat;
            opacity: 0;
            transform: scale(1.05);
            animation: photoReveal 1.8s ease forwards;
            mask-image: linear-gradient(to bottom, transparent, #000 17%, #000 66%, transparent);
        }

        header::after {
            z-index: -1;
            background: linear-gradient(to bottom, #09090a55, #09090a66 54%, #101014);
        }

            background: linear-gradient(to bottom, #0f111833, #0f111855 55%, #f4f3f0);

            margin: 0;
            text-shadow: 0 6px 30px #0009;
        }

        header p {
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 13px;
        }

        header > div {
            animation: heroContent 1s ease both;
        }

        .cta {
            display: inline-block;
            margin-top: 24px;
            color: white;
            text-decoration: none;
            border: 1px solid #fff9;
            border-radius: 50px;
            padding: 14px 42px;
            background: #ffffff2b;
            backdrop-filter: blur(14px);
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: .3s;
        }

        .cta:hover {
            background: white;
            color: #111;
            transform: translateY(-3px);
        }

        section {
            padding: 75px 9%;
            scroll-margin-top: 75px;
        }

        h2 {
            text-align: center;
            font: 500 clamp(26px, 5vw, 38px) 'Playfair Display';
            margin: 0 0 35px;
        }

        .search-box {
            max-width: 500px;
            margin: 0 auto 25px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 22px;
            border-radius: 30px;
            border: 1px solid #ffffff35;
            background: #ffffff12;
            color: inherit;
            outline: none;
            font-size: 14px;
            backdrop-filter: blur(12px);
            transition: .3s;
        }

        .search-box input:focus {
            border-color: #d8bd85;
            box-shadow: 0 0 20px #d8bd8520;
        }

        .search-box input::placeholder {
            color: #999;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 9px 20px;
            border-radius: 30px;
            border: 1px solid #ffffff35;
            background: transparent;
            color: inherit;
            cursor: pointer;
            transition: .3s;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: #f1d9a0;
            color: #181818;
            border-color: #f1d9a0;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 15px;
        }

        .card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 19px 20px;
            border-radius: 20px;
            border: 1px solid #ffffff30;
            background: linear-gradient(135deg, #ffffff1c, #ffffff08);
            backdrop-filter: blur(14px);
            box-shadow: inset 0 1px 1px #ffffff5c, 0 10px 28px #0002;
            transition: .3s;
            animation: cardAppear .5s ease both;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #f1d9a080;
            box-shadow: 0 12px 30px #0004;
        }

        body.light .card {
            background: linear-gradient(135deg, #fff, #eeedf0);
            border-color: #2222;
            box-shadow: 0 8px 24px #25252b12;
        }

        .card h3 {
            font-size: 14px;
            font-weight: 400;
            margin: 0;
        }

        .price {
            color: #f1d9a0;
            white-space: nowrap;
            font-weight: 500;
            font-size: 14px;
        }

        body.light .price {
            color: #8c5a19;
        }

        .favorite {
            position: absolute;
            top: 8px;
            right: 8px;
            border: none;
            background: transparent;
            color: #aaa;
            font-size: 17px;
            cursor: pointer;
            transition: .2s;
        }

        .favorite.active {
            color: #ff647c;
        }

        .popular {
            display: inline-block;
            font-size: 9px;
            color: #e7c987;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .empty {
            text-align: center;
            opacity: .6;
            padding: 40px 10px;
            grid-column: 1 / -1;
        }

        .foot {
            text-align: center;
            opacity: .65;
            padding: 30px;
            border-top: 1px solid #ffffff15;
        }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes heroContent {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {

                transform: translateY(0);
            }
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        const translations = {
            ru,
            en
        };


        const popular = [
            'Steak',
            'Qızılbalıq',
            'Sezar Toyuq',
            'Pad Thai Pasta',
            'OHIO Mix omlet',
            'Sac quzu (2 nəfərlik)'
        ];


        const root = document.getElementById('content');
        const lang = document.getElementById('language');
        const search = document.getElementById('search');

        let filter = 'all';

        let favorites = JSON.parse(
            localStorage.getItem('ohio-favorites') || '[]'
        );


        function getName(name) {
            const l = lang.value;

            if (l === 'az') return name;

            return translations[l][name] || name;
        }


        function render() {
            const l = lang.value;
            const t = words[l];
            const query = search.value.toLowerCase().trim();

            document.documentElement.lang = l;

            document.querySelectorAll('[data-t]').forEach(element => {
                element.textContent = t[element.dataset.t];
            });

            search.placeholder = t.search;

            root.innerHTML = cats.map((items, i) => {

                const cards = items.filter(([name]) => {

                    const translated = getName(name).toLowerCase();

                    const matchesSearch =
                        name.toLowerCase().includes(query) ||
                        translated.includes(query);

                    const matchesFavorites =
                        filter !== 'favorites' || favorites.includes(name);

                    const matchesPopular =
                        filter !== 'popular' || popular.includes(name);

                    return matchesSearch && matchesFavorites && matchesPopular;

                });

                if (cards.length === 0) return '';

                return `
                    <section id="${i === 2 ? 'main' : i === 10 ? 'drinks' : 'category-' + i}">

                        <h2>${t.categories[i]}</h2>

                        <div class="menu">

                            ${cards.map(([name, price]) => {

                                const isPopular = popular.includes(name);
                                const isFavorite = favorites.includes(name);

                                return `
                                    <article class="card">

                                        <button
                                            class="favorite ${isFavorite ? 'active' : ''}"
                                            data-name="${name.replace(/"/g, '&quot;')}"
                                            aria-label="Favorite"
                                        >
                                            ${isFavorite ? '♥' : '♡'}
                                        </button>

                                        <div>
                                            ${isPopular ? `<span class="popular">★ ${t.popular}</span>` : ''}

                                            <h3>${getName(name)}</h3>
                                        </div>

                                        <span class="price">
                                            ${typeof price === 'number' ? price.toFixed(2) : price} ₼
                                        </span>

                                    </article>
                                `;

                            }).join('')}

                        </div>

                    </section>
                `;

            }).join('');


            if (!root.innerHTML) {
                root.innerHTML = `
                    <div class="empty">
                        ${filter === 'favorites' && !query ? t.empty : t.noResults}
                    </div>
                `;
            }


            root.querySelectorAll('.favorite').forEach(button => {

                button.addEventListener('click', () => {

                    const name = button.dataset.name;

                    if (favorites.includes(name)) {
                        favorites = favorites.filter(item => item !== name);
                    } else {
                        favorites.push(name);
                    }

                    localStorage.setItem(
                        'ohio-favorites',
                        JSON.stringify(favorites)
                    );

                    render();

                });

            });

        }


        lang.value = localStorage.getItem('ohio-language') || 'ru';

        if (!words[lang.value]) {
            lang.value = 'ru';
        }

        lang.addEventListener('change', () => {

            localStorage.setItem('ohio-language', lang.value);

            updateTheme();
            render();

        });


        search.addEventListener('input', render);


        document.querySelectorAll('.filter-btn').forEach(button => {

            button.addEventListener('click', () => {

                filter = button.dataset.filter;

                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                });

                button.classList.add('active');

                render();

            });

        });


        function updateTheme() {

            const light = document.body.classList.contains('light');

            document.getElementById('theme').textContent =
                words[lang.value].toggle + ': ' + (light ? '☼' : '☾');

        }


        function setTheme(light) {

            document.body.classList.toggle('light', light);

            localStorage.setItem(
                'ohio-theme',
                light ? 'light' : 'dark'
            );

            updateTheme();

        }


        setTheme(localStorage.getItem('ohio-theme') === 'light');

        document.getElementById('theme').addEventListener('click', () => {

            setTheme(!document.body.classList.contains('light'));

        });


        render();

    </script>
